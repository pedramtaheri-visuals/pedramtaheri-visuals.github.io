<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paintings | Pedram Taheri</title>
    <!-- آیکون بالای صفحه (Favicon) - نام عکس آیکون خود را جایگزین کنید -->
    <link rel="icon" type="image/x-icon" href="favicon.png">
    <style>
        /* تنظیمات فونت و رنگ زمینه تاریک و هنری */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0c10;
            color: #c5c6c7;
            margin: 0;
            padding: 0;
        }

        /* هدر و منوی بالای صفحه */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background-color: #1f2833;
            border-bottom: 1px solid #45f3ff33;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #45f3ff;
            text-decoration: none;
            letter-spacing: 2px;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            margin-right: 20px;
            font-size: 16px;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #45f3ff;
        }

        /* عنوان صفحه گالری */
        .gallery-title {
            text-align: center;
            margin: 50px 0 20px;
        }

        .gallery-title h1 {
            font-size: 36px;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .gallery-title p {
            color: #66fcf1;
            font-size: 18px;
        }

        /* چیدمان کارت‌های گالری */
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            padding: 40px 8%;
        }

        .paint-card {
            background-color: #1f2833;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .paint-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(69, 243, 255, 0.2);
        }

        /* تنظیمات ابعاد تصاویر */
        .paint-img-wrapper {
            width: 100%;
            height: 350px; /* ارتفاع ثابت برای هماهنگی کارت‌ها */
            overflow: hidden;
            cursor: pointer;
        }

        .paint-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* تصویر بدون دفرمه شدن کل کادر را پر می‌کند */
            transition: transform 0.5s;
        }

        .paint-card:hover .paint-img-wrapper img {
            transform: scale(1.05);
        }

        /* اطلاعات نقاشی */
        .paint-info {
            padding: 20px;
            text-align: center;
        }

        .paint-info h3 {
            margin: 0 0 10px;
            color: #ffffff;
            font-size: 20px;
        }

        .paint-info p {
            margin: 5px 0;
            font-size: 14px;
            color: #a9b7c6;
        }

        .paint-info .meta {
            color: #45f3ff;
            font-weight: bold;
            margin-top: 10px;
        }

        /* فوتر سایت */
        footer {
            text-align: center;
            padding: 30px;
            background-color: #1f2833;
            margin-top: 50px;
            font-size: 14px;
            color: #66fcf1;
        }

        /* سیستم بزرگ‌نمایی تصویر (Lightbox) */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 85%;
            border: 2px solid #45f3ff;
            border-radius: 4px;
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 40px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- هدر سایت -->
    <header>
        <a href="index.html" class="logo">PEDRAM TAHERI</a>
        <nav dir="ltr">
            <a href="index.html">Home</a>
            <a href="paintings.html" style="color: #45f3ff;">Paintings</a>
            <a href="#">Astrophotography</a>
            <a href="#">About</a>
        </nav>
    </header>

    <!-- عنوان صفحه -->
    <div class="gallery-title">
        <h1>Paintings</h1>
        <p>Fine Art by Pedram Taheri</p>
    </div>

    <!-- بخش گالری نقاشی‌ها -->
    <div class="gallery-container">
        
        <!-- نقاشی اول -->
        <div class="paint-card">
            <div class="paint-img-wrapper" onclick="openLightbox('p1.jpg')">
                <!-- به جای p1.jpg اسم فایل عکس واقعی خود را قرار دهید -->
                <img src="p1.jpg" alt="Untitled I">
            </div>
            <div class="paint-info">
                <h3>Untitled I</h3>
                <p>Acrylic & Texture on Canvas</p>
                <p>80 x 80 cm</p>
                <p class="meta">2025</p>
            </div>
        </div>

        <!-- نقاشی دوم -->
        <div class="paint-card">
            <div class="paint-img-wrapper" onclick="openLightbox('p2.jpg')">
                <!-- به جای p2.jpg اسم فایل عکس واقعی خود را قرار دهید -->
                <img src="p2.jpg" alt="Untitled II">
            </div>
            <div class="paint-info">
                <h3>Untitled II</h3>
                <p>Oil on Canvas</p>
                <p>60 x 90 cm</p>
                <p class="meta">2024</p>
            </div>
        </div>

        <!-- نقاشی سوم -->
        <div class="paint-card">
            <div class="paint-img-wrapper" onclick="openLightbox('p3.jpg')">
                <!-- به جای p3.jpg اسم فایل عکس واقعی خود را قرار دهید -->
                <img src="p3.jpg" alt="Untitled III">
            </div>
            <div class="paint-info">
                <h3>Untitled III</h3>
                <p>Mixed Media on Canvas</p>
                <p>100 x 100 cm</p>
                <p class="meta">2025</p>
            </div>
        </div>

    </div>

    <!-- پنجره بزرگ‌نمایی عکس -->
    <div id="customLightbox" class="lightbox" onclick="closeLightbox()">
        <span class="lightbox-close">&times;</span>
        <img id="lightboxImg" src="">
    </div>

    <!-- فوتر -->
    <footer>
        © 2026 Pedram Taheri. All Rights Reserved.
    </footer>

    <!-- کدهای جاوااسکریپت برای باز و بسته شدن عکس‌ها -->
    <script>
        function openLightbox(imgSrc) {
            document.getElementById('lightboxImg').src = imgSrc;
            document.getElementById('customLightbox').style.display = 'flex';
        }
        function closeLightbox() {
            document.getElementById('customLightbox').style.display = 'none';
        }
    </script>

</body>
</html>
