<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paintings | Pedram M.Taheri</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; color: #111111; line-height: 1.6; -webkit-font-smoothing: antialiased; }
        header { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 50px 20px 30px; }
        .brand-logo { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 600; letter-spacing: 1px; color: #111111; text-decoration: none; }
        nav { display: flex; gap: 35px; }
        nav a { font-size: 14px; font-weight: 400; color: #777777; text-decoration: none; transition: color 0.2s ease; }
        nav a:hover, nav a.active { color: #111111; font-weight: 500; }
        main { max-width: 1200px; margin: 0 auto; padding: 40px 20px 100px; }
        .section-header { margin-bottom: 50px; border-bottom: 1px solid #e5e5e5; padding-bottom: 20px; }
        .section-header h1 { font-family: 'Playfair Display', serif; font-size: 38px; font-weight: 400; color: #111111; }
        /* Masonry Layout */
        .masonry-gallery { column-count: 3; column-gap: 40px; }
        .artwork-card { break-inside: avoid; margin-bottom: 40px; padding-bottom: 25px; border-bottom: 1px solid #f5f5f5; }
        .image-box { background-color: #fafafa; border: 1px solid #eaeaea; padding: 15px; cursor: zoom-in; }
        .image-box img { width: 100%; height: auto; display: block; transition: opacity 0.3s ease; }
        .details-box { padding-top: 15px; font-size: 13px; color: #666; }
        .details-box h2 { font-family: 'Playfair Display', serif; font-size: 20px; color: #111; margin-bottom: 8px; }
        footer { text-align: center; padding: 40px 20px; border-top: 1px solid #e5e5e5; font-size: 13px; color: #888; }
        /* Responsive */
        @media (max-width: 900px) { .masonry-gallery { column-count: 2; } }
        @media (max-width: 600px) { header { flex-direction: column; } .masonry-gallery { column-count: 1; } }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="brand-logo">PEDRAM M.TAHERI</a>
        <nav><a href="index.html">About</a><a href="paintings.html" class="active">Paintings</a><a href="#">Contact</a></nav>
    </header>
    <main>
        <div class="section-header"><h1>Paintings</h1></div>
        <div class="masonry-gallery">
            <!-- Example: Generate 11 items with p1.jpg to p11.jpg -->
            <div class="artwork-card"><div class="image-box"><img src="p1.jpg" alt="Artwork"></div><div class="details-box"><h2>Title</h2><p>Description</p></div></div>
            <!-- ...repeat for all 11 items... -->
        </div>
    </main>
    <footer>© 2026 Pedram M.Taheri</footer>
</body>
</html>
