<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Pedram Taheri</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <!-- لود کردن آیکون‌های مدرن شبکه‌های اجتماعی -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body { background-color: #0c0f14; color: #f1f2f6; font-family: 'Montserrat', sans-serif; margin: 0; padding: 0; }
        .minimal-nav { width: 100%; display: flex; flex-direction: column; align-items: center; padding: 50px 20px 30px 20px; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); border-bottom: 1px solid #1e2430; box-sizing: border-box; }
        .minimal-logo { font-family: 'Cinzel', serif; font-size: 32px; color: #ffffff; text-decoration: none; letter-spacing: 7px; margin-bottom: 25px; }
        nav { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; }
        nav a { color: rgba(255, 255, 255, 0.7); text-decoration: none; font-size: 13px; text-transform: uppercase; letter-spacing: 2px; transition: color 0.3s; }
        nav a:hover, nav a.active-page { color: #ffffff; }
        .contact-container { max-width: 600px; margin: 0 auto; padding: 60px 20px; }
        .contact-container h1 { font-family: 'Cinzel', serif; font-size: 36px; color: #ffffff; text-align: center; letter-spacing: 2px; margin-bottom: 40px; font-weight: 400; }
        .contact-form { display: flex; flex-direction: column; gap: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 12px; text-transform: uppercase; letter-spacing: 2px; color: #a4b0be; }
        .form-group input, .form-group textarea { background-color: #131822; border: 1px solid #1e2430; padding: 15px; color: #ffffff; font-family: 'Montserrat', sans-serif; font-size: 14px; transition: border-color 0.3s; }
        .form-group input:focus, .form-group textarea:focus { outline: none; border-color: rgba(255,255,255,0.5); }
        .submit-btn { background-color: transparent; border: 1px solid #ffffff; color: #ffffff; padding: 15px; font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; transition: background 0.3s, color 0.3s; margin-top: 10px; }
        .submit-btn:hover { background-color: #ffffff; color: #0c0f14; }
        .social-section { text-align: center; margin-top: 60px; padding-top: 40px; border-top: 1px solid #1e2430; }
        .social-section h3 { font-family: 'Cinzel', serif; font-size: 18px; letter-spacing: 2px; margin-bottom: 25px; color: #ffffff; font-weight: 400; }
        .social-icons { display: flex; justify-content: center; gap: 35px; }
        .social-icons a { color: rgba(255,255,255,0.6); font-size: 24px; transition: color 0.3s, transform 0.3s; text-decoration: none; }
        .social-icons a:hover { color: #ffffff; transform: translateY(-5px); }
        @media (max-width: 768px) { .minimal-logo { font-size: 22px; } nav { gap: 15px 20px; } nav a { font-size: 11px; } .contact-container { padding: 40px 20px; } .contact-container h1 { font-size: 28px; } }
    </style>
</head>
<body>
    <header class="minimal-nav">
        <a href="index.html" class="minimal-logo">PEDRAM M.TAHERI</a>
        <nav>
            <a href="about.html">About</a>
            <a href="paintings.html">Paintings</a>
            <a href="exhibition.html">Exhibitions</a>
            <a href="workshop.html">Workshops</a>
            <a href="nightscape.html">Night sky</a>
            <a href="contact.html" class="active-page">Contact</a>
            <a href="blog.html">Blog</a>
        </nav>
    </header>
    <main class="contact-container">
        <h1>Connect With Me</h1>
        <!-- فرم تماس مینی‌مال -->
        <form class="contact-form" action="#" method="POST">
            <div class="form-group"><label>Name</label><input type="text" required></div>
            <div class="form-group"><label>Email</label><input type="email" required></div>
            <div class="form-group"><label>Message</label><textarea rows="6" required></textarea></div>
            <button type="submit" class="submit-btn">Send Message</button>
        </form>
        <!-- بخش شبکه‌های اجتماعی -->
        <section class="social-section">
            <h3>Follow My Journey</h3>
            <div class="social-icons">
                <a href="https://instagram.com" target="_blank" title="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="https://youtube.com" target="_blank" title="YouTube"><i class="fab fa-youtube"></i></a>
                <a href="https://facebook.com" target="_blank" title="Facebook"><i class="fab fa-facebook-f"></i></a>
            </div>
        </section>
    </main>
    <footer style="text-align: center; padding: 40px; color: #57606f; border-top: 1px solid #1e2430; font-size: 12px; font-family: 'Montserrat', sans-serif; letter-spacing: 1px; background-color: #0c0f14;" dir="ltr">
        <p style="margin: 0; display: inline-block;">&copy; 2026 Pedram M. Taheri. All rights reserved.</p>
    </footer>
</body>
</html>
