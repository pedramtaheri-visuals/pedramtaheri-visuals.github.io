<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About | Pedram Taheri</title>
    
    <!-- لود کردن دقیق فونت‌های هماهنگ با صفحه اصلی -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cinzel:wght@400;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        /* تم تاریک هماهنگ با صفحه اصلی */
        body { 
            background-color: #0c0f14; 
            color: #f1f2f6; 
            font-family: 'Montserrat', sans-serif; 
            margin: 0; 
            padding: 0; 
        }
        
        /* منوی ظریف و مینی‌مال بالای صفحه بدون هدر بزرگ */
        .minimal-nav-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px 20px 20px;
            background-color: #0c0f14;
            box-sizing: border-box;
            border-bottom: 1px solid #1e2430;
        }
        .minimal-logo { 
            font-family: 'Cinzel', serif; 
            font-size: 28px; 
            font-weight: 400; 
            color: #ffffff; 
            text-decoration: none; 
            letter-spacing: 6px; 
            margin-bottom: 20px; 
        }
        nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap; 
            gap: 30px; 
        }
        nav a { 
            font-family: 'Montserrat', sans-serif;
            color: rgba(255, 255, 255, 0.6); 
            text-decoration: none; 
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 2px; 
            text-transform: uppercase;
            transition: color 0.3s; 
        }
        nav a:hover, nav a.active-page { 
            color: #ffffff; 
        }

        /* قاب عکس افقی عریض و سینمایی در بالای صفحه */
        .about-hero-banner {
            width: 100%;
            height: 60vh; /* ارتفاع متناسب افقی کامپیوتر */
            overflow: hidden;
            border-bottom: 1px solid #1e2430;
            background-color: #0c0f14;
        }
        .about-hero-banner img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* چسبیدن کامل عکس بدون دفرمه شدن */
            object-position: center;
        }

        /* ساختار بخش متن بیوگرافی زیر عکس */
        .about-content-section {
            max-width: 800px;
            margin: 0 auto;
            padding: 80px 20px;
        }
        .about-content-section h1 {
            font-family: 'Cinzel', serif;
            font-size: 36px;
            color: #ffffff;
            font-weight: 400;
            letter-spacing: 2px;
            margin-bottom: 40px;
            text-align: center;
        }
        .about-text {
            font-size: 16px;
            color: #bdc3c7;
            line-height: 1.9;
            font-weight: 300;
            text-align: justify;
        }
        .about-text p {
            margin-bottom: 30px;
        }

        /* ریسپانسیو قاب عکس برای موبایل */
        @media (max-width: 768px) {
            .minimal-logo { font-size: 20px; letter-spacing: 4px; }
            nav { gap: 15px 20px; }
            nav a { font-size: 11px; letter-spacing: 1px; }
            .about-hero-banner { height: 40vh; } /* کاهش ارتفاع در موبایل برای حفظ کادر افقی */
            .about-content-section { padding: 50px 20px; }
            .about-content-section h1 { font-size: 28px; margin-bottom: 30px; }
        }
    </style>
</head>
