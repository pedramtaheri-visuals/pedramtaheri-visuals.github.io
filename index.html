<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedram Taheri | Visual Exploration</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { background-color: #0c0f14; color: #f1f2f6; font-family: 'Montserrat', sans-serif; margin: 0; padding: 0; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 35px; padding: 0 8% 80px 8%; }
        .art-card { position: relative; height: 480px; border: 1px solid #1e2430; border-radius: 12px; overflow: hidden; text-decoration: none; display: flex; align-items: flex-end; transition: transform 0.4s; }
        .art-card:hover { transform: translateY(-10px); }
        .card-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        .card-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to top, rgba(12, 15, 20, 0.95) 15%, transparent 100%); z-index: 2; }
        .card-content { position: relative; z-index: 3; padding: 35px 25px; text-align: center; color: #fff; }
        .btn { display: inline-block; padding: 10px 20px; border: 1px solid #fff; color: #fff; text-decoration: none; font-size: 12px; text-transform: uppercase; }
    </style>
</head>
<body>
    <main>
        <section class="grid-container">
            <!-- Paintings -->
            <a href="paintings.html" class="art-card">
                <img src="painting-cover.jpg" alt="Paintings" class="card-bg">
                <div class="card-overlay"></div>
                <div class="card-content">
                    <h3>Fine Art</h3>
                    <p>Expressions</p>
                    <span class="btn">Explore</span>
                </div>
            </a>
            <!-- Astrophotography -->
            <a href="astrophotography.html" class="art-card">
                <img src="astro-cover.jpg" alt="Astrophotography" class="card-bg">
                <div class="card-overlay"></div>
                <div class="card-content">
                    <h3>Astrophotography</h3>
                    <p>Cosmic Exploration</p>
                    <span class="btn">View</span>
                </div>
            </a>
            <!-- Academy -->
            <a href="classes.html" class="art-card">
                <img src="classes-cover.jpg" alt="Academy" class="card-bg">
                <div class="card-overlay"></div>
                <div class="card-content">
                    <h3>Academy</h3>
                    <p>Workshops</p>
                    <span class="btn">Join</span>
                </div>
            </a>
        </section>
    </main>
</body>
</html>
