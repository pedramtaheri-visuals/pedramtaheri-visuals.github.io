<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedram Taheri | Visual Exploration</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { background-color: #0c0f14; color: #f1f2f6; font-family: 'Montserrat', sans-serif; margin: 0; }
        
        /* اصلاح شده: اندازه تصویر کوچک‌تر و مکان آن پایین‌تر */
        .immersive-header-container {
            position: relative;
            width: 100%;
            height: 80vh; /* کاهش ارتفاع کلی */
            background-image: url('hero-painting.jpg'); 
            background-size: cover; /* تنظیم سایز تصویر */
            background-repeat: no-repeat;
            background-position: center; /* قرارگیری در مرکز */
            border-bottom: 1px solid #1e2430;
            display: flex;
            flex-direction: column;
            justify-content: flex-start; /* شروع محتوا از بالا */
            padding-top: 50px; /* ایجاد فاصله از لبه بالای صفحه */
        }

        .nav-overlay-header {
            display: flex;
            flex-direction: column; 
            align-items: center;
            padding: 20px;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.5) 0%, transparent 100%);
            z-index: 10;
        }

        .logo { font-family: 'Cinzel', serif; font-size: 32px; color: #ffffff; text-decoration: none; letter-spacing: 7px; margin-bottom: 25px; }
        nav { display: flex; justify-content: center; gap: 30px; }
        nav a { color: rgba(255, 255, 255, 0.7); text-decoration: none; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; }
        
        .banner-bottom-fade { position: absolute; bottom: 0; width: 100%; height: 30%; background: linear-gradient(to top, #0c0f14 0%, transparent 100%); }
        .hero { text-align: center; padding: 50px 20px; }
        .hero h1 { font-weight: 300; color: #ffffff; }
        .gallery-section { padding: 0 8% 80px 8%; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
        .art-card { position: relative; height: 400px; border: 1px solid #1e2430; text-decoration: none; display: flex; align-items: flex-end; }
        .card-bg { position: absolute; width: 100%; height: 100%; object-fit: cover; }
        .card-overlay { position: absolute; width: 100%; height: 100%; background: linear-gradient(to top, #0c0f14 0%, transparent 70%); }
        .card-content { position: relative; padding: 20px; color: #fff; text-align: center; width: 100%; }
        footer { text-align: center; padding: 30px; color: #57606f; }
    </style>
</head>
<body>
    <header class="immersive-header-container">
        <div class="nav-overlay-header">
            <a href="#" class="logo">PEDRAM M.TAHERI</a>
            <nav>
                <a href="#">About</a> <a href="#">Paintings</a> <a href="#">Contact</a>
            </nav>
        </div>
        <div class="banner-bottom-fade"></div>
    </header>
    <main>
        <section class="hero"><h1>Visual Exploration</h1></section>
    </main>
</body>
</html>
