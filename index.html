<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedram Taheri | Visual Exploration</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        spaceBg: '#07080a',
                        spaceCard: '#13161c',
                        goldAccent: '#c5a059',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-spaceBg text-white font-sans">
    <!-- Header -->
    <header class="flex justify-between items-center p-6 border-b border-gray-800 sticky top-0 bg-spaceBg/90 backdrop-blur-sm z-50">
        <h1 class="text-xl font-bold tracking-widest">PEDRAM TAHERI</h1>
        <nav class="space-x-4 text-sm uppercase text-gray-400">
            <a href="#paintings" class="hover:text-goldAccent">Paintings</a>
            <a href="#astro" class="hover:text-goldAccent">Astrophotography</a>
        </nav>
    </header>
    <!-- Main Content -->
    <main class="p-6 md:p-12 grid grid-cols-1 md:grid-cols-2 gap-8">
        <div class="bg-spaceCard p-6 rounded-lg border border-gray-800">
            <h2 class="text-goldAccent text-2xl mb-4">Fine Art</h2>
            <p class="text-gray-300">Internal Exploration: Expression of emotions on canvas.</p>
        </div>
        <div class="bg-spaceCard p-6 rounded-lg border border-gray-800">
            <h2 class="text-goldAccent text-2xl mb-4">Astrophotography</h2>
            <p class="text-gray-300">Cosmic Exploration: Capturing deep-sky wonders.</p>
        </div>
    </main>
</body>
</html>
