<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedram Taheri | Visual Exploration</title>
    
    <!-- لود کردن صحیح فونت‌ها با اصلاح ساختار لینک گوگل -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cinzel:wght@400;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        /* Modern Immersive Theme Base */
        body { 
            background-color: #0c0f14; 
            color: #f1f2f6; 
            font-family: 'Montserrat', sans-serif; 
            margin: 0; 
            padding: 0; 
        }
        
        /* THE PERFECT FULL-WIDTH EXTENDED BANNER */
        .immersive-header-container {
            position: relative;
            width: 100%;
            height: 105vh; 
            background-image: url('hero-painting.jpg'); 
            background-size: 100% auto; 
            background-repeat: no-repeat;
            background-position: top center;
            background-color: #0c0f14;
            border-bottom: 1px solid #1e2430;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Responsive height fix for laptops and smaller screens */
        @media (max-width: 1400px) {
            .immersive-header-container { height: 95vh; }
        }
        @media (max-width: 1024px) {
            .immersive-header-container { height: 75vh; background-size: cover; }
        }

        /* ساختار دو خطی هدر بر اساس تصویر ارسالی شما */
        .nav-overlay-header {
            display: flex;
            flex-direction: column; 
            align-items: center;
            justify-content: center;
            padding: 50px 20px 30px 20px;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.8) 0%, transparent 100%);
            z-index: 10;
        }

        /* استایل لوگو - حفظ فونت اصیل و لوکس Cinzel به عنوان امضا */
        .logo { 
            font-family: 'Cinzel', serif; 
            font-size: 32px; 
            font-weight: 400; 
            color: #ffffff; 
            text-decoration: none; 
            letter-spacing: 7px; 
            margin-bottom: 25px; 
            text-shadow: 0 2px 8px rgba(0,0,0,0.8); 
            transition: color 0.3s;
        }
        .logo:hover {
            color: #bdc3c7;
        }

        /* ردیف منوها - بازگشت به فونت مدرن و خوانای Montserrat */
        nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap; 
            gap: 30px; 
        }

        nav a { 
            font-family: 'Montserrat', sans-serif;
            color: rgba(255, 255, 255, 0.7); 
            text-decoration: none; 
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 2px; 
            text-transform: uppercase;
            transition: color 0.3s, letter-spacing 0.3s; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }
        nav a:hover { 
            color: #ffffff; 
            letter-spacing: 3px; 
        }
        
        nav a.active-blog {
            color: #ffffff;
            font-weight: 600;
        }

        /* بهینه‌سازی کامل برای موبایل */
        @media (max-width: 768px) {
            .logo {
                font-size: 22px; 
                letter-spacing: 4px;
                margin-bottom: 15px;
            }
            nav {
                gap: 15px 20px; 
                padding: 0 10px;
            }
            nav a {
                font-size: 11px; 
                letter-spacing: 1px;
            }
        }

        /* Smooth extended dark fade at the bottom */
        .banner-bottom-fade {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 35%; 
            background: linear-gradient(to top, #0c0f14 15%, transparent 100%);
            z-index: 1;
        }

        /* Hero Text Box below the painting banner */
        .hero { 
            text-align: center; 
            padding: 90px 20px 60px 20px; 
            max-width: 800px; 
            margin: 0 auto; 
        }
        .hero h1 { font-family: 'Montserrat', sans-serif; font-size: 42px; color: #ffffff; font-weight: 300; letter-spacing: 3px; margin-bottom: 20px; }
        .hero p { font-size: 17px; color: #747d8c; line-height: 1.8; font-weight: 300; }
        /* Gallery Grid Options - CSS */
        .gallery-section { padding: 0 8% 80px 8%; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 35px; margin-top: 20px; }
        .art-card { position: relative; height: 480px; ... } /* ... بقیه استایل‌ها */
    </style>
</head>
<body>
    <!-- ساختار HTML گالری، کارت‌ها و فوتر -->
    <main>
        <section class="gallery-section">
            <div class="grid-container">
                <!-- سه کارت آرت، اخترشناسی و آکادمی -->
            </div>
        </section>
    </main>
    <footer>...</footer>
</body>
</html>
