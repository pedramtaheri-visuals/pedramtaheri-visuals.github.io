<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedram Taheri | Visual Exploration</title>
    <style>
        /* ... سایر استایل‌ها (بدنه، هدر، فونت‌ها) ... */
        body { background-color: #0c0f14; color: #f1f2f6; font-family: 'Helvetica Neue', sans-serif; margin: 0; }
        header { display: flex; justify-content: space-between; padding: 30px 8%; border-bottom: 1px solid #1e2430; }
        .logo { font-size: 22px; font-weight: bold; color: #ffffff; text-decoration: none; }
        nav a { color: #a4b0be; text-decoration: none; margin-left: 25px; transition: color 0.3s; }
        nav a:hover { color: #f39c12; }
        
        /* NEW: Hero Banner Styles */
        .hero-banner {
            width: 100%;
            height: 450px;
            overflow: hidden;
            border-bottom: 1px solid #1e2430;
        }
        .hero-banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        /* ... استایل‌های بخش متن (hero) و گرید ... */
        .hero { text-align: center; padding: 60px 20px; max-width: 800px; margin: 0 auto; }
        .hero h1 { font-size: 46px; color: #ffffff; }
        .gallery-section { padding: 0 8% 80px 8%; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 35px; }
        .art-card { position: relative; height: 480px; border: 1px solid #1e2430; border-radius: 12px; overflow: hidden; text-decoration: none; }
        .card-bg { width: 100%; height: 100%; object-fit: cover; }
        .card-content { position: absolute; bottom: 0; width: 100%; text-align: center; background: rgba(12, 15, 20, 0.8); padding: 20px; }
        .btn { display: inline-block; padding: 10px 20px; border: 1px solid #fff; color: #fff; text-decoration: none; }
        footer { text-align: center; padding: 40px; color: #57606f; }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">PEDRAM TAHERI</a>
        <nav>
            <a href="paintings.html">Paintings</a>
            <a href="astrophotography.html">Astrophotography</a>
            <a href="about.html">About</a>
        </nav>
    </header>

    <main>
        <!-- NEW: Wide Hero Banner -->
        <section class="hero-banner">
            <img src="hero-painting.jpg" alt="Featured Painting by Pedram Taheri">
        </section>

        <section class="hero">
            <h1>Visual Exploration</h1>
            <p>Welcome to my creative universe...</p>
        </section>

        <!-- ... بخش سه گانه (gallery-section) ... -->
        <section class="gallery-section">
            <div class="grid-container">
                <a href="paintings.html" class="art-card">
                    <img src="painting-cover.jpg" alt="Fine Art" class="card-bg">
                    <div class="card-content"><h3>Paintings</h3><span class="btn">Explore</span></div>
                </a>
                <a href="astrophotography.html" class="art-card">
                    <img src="astro-cover.jpg" alt="Astrophotography" class="card-bg">
                    <div class="card-content"><h3>Astrophotography</h3><span class="btn">View</span></div>
                </a>
                <a href="classes.html" class="art-card">
                    <img src="classes-cover.jpg" alt="Academy" class="card-bg">
                    <div class="card-content"><h3>Academy</h3><span class="btn">Join</span></div>
                </a>
            </div>
        </section>
    </main>

    <footer><p>&copy; 2026 Pedram Taheri</p></footer>
</body>
</html>
