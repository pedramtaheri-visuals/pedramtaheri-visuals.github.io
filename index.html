<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedram Taheri | Visual Exploration</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { background-color: #0c0f14; color: #f1f2f6; font-family: 'Montserrat', sans-serif; margin: 0; }
        .immersive-header-container { position: relative; width: 100%; height: 160vh; background-image: url('hero-painting.jpg'); background-size: cover; background-position: center; border-bottom: 1px solid #1e2430; display: flex; flex-direction: column; justify-content: space-between; }
        .nav-overlay-header { display: flex; flex-direction: column; align-items: center; padding: 40px 20px; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); }
        .logo { font-family: 'Cinzel', serif; font-size: 28px; letter-spacing: 5px; color: #fff; text-decoration: none; margin-bottom: 20px; }
        nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
        nav a { color: rgba(255,255,255,0.7); text-decoration: none; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
        .hero { text-align: center; padding: 60px 20px; max-width: 800px; margin: 0 auto; }
        .hero h1 { font-size: 36px; font-weight: 300; color: #fff; }
        .gallery-section { padding: 0 5% 60px 5%; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
        .art-card { position: relative; height: 400px; border-radius: 8px; overflow: hidden; text-decoration: none; display: flex; align-items: flex-end; }
        .card-bg { position: absolute; width: 100%; height: 100%; object-fit: cover; }
        .card-overlay { position: absolute; width: 100%; height: 100%; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); }
        .card-content { position: relative; padding: 20px; color: #fff; text-align: center; }
        .btn { display: inline-block; padding: 10px 20px; border: 1px solid #fff; color: #fff; text-decoration: none; font-size: 11px; text-transform: uppercase; }
        @media (max-width: 768px) { .immersive-header-container { height: 100vh; } }
    </style>
</head>
<body>
    <header class="immersive-header-container">
        <div class="nav-overlay-header">
            <a href="#" class="logo">PEDRAM M.TAHERI</a>
            <nav>
                <a href="#">About</a> <a href="#">Paintings</a> <a href="#">Exhibitions</a>
                <a href="#">Workshops</a> <a href="#">Night sky</a> <a href="#">Contact</a>
            </nav>
        </div>
    </header>
    <main>
        <section class="hero">
            <h1>Visual Exploration</h1>
            <p>Connecting emotional painting and cosmic astrophotography.</p>
        </section>
        <section class="gallery-section">
            <div class="grid-container">
                <a href="#" class="art-card">
                    <img src="painting-cover.jpg" class="card-bg">
                    <div class="card-overlay"></div>
                    <div class="card-content"><h3>Fine Art</h3><span class="btn">Explore</span></div>
                </a>
                <a href="#" class="art-card">
                    <img src="astro-cover.jpg" class="card-bg">
                    <div class="card-overlay"></div>
                    <div class="card-content"><h3>Astrophotography</h3><span class="btn">View</span></div>
                </a>
                <a href="#" class="art-card">
                    <img src="classes-cover.jpg" class="card-bg">
                    <div class="card-overlay"></div>
                    <div class="card-content"><h3>Academy</h3><span class="btn">Join</span></div>
                </a>
            </div>
        </section>
    </main>
</body>
</html>
